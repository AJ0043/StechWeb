{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="icon" href="{% static 'Images/stec.png' %}" type="image/x-icon">
    <title>{% block title %}STECH Web Development{% endblock title %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .navbar {
            background: rgb(6, 175, 161);
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 85px;
        }
        .navbar .logo img {
            width: 70px;
            height: 60px;
            border-radius: 10px;
        }
        .menu-toggle { display: none; }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 3.5rem;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 25px;
            font-weight: bold;
            font-family: 'Satisfy', cursive;
        }
        .nav-links a:hover { color: yellow; }
        .sidebar {
            width: 270px;
            background: rgb(10, 96, 89);
            color: white;
            height: 100vh;
            padding: 20px;
            position: fixed;
            top: 80px;
            left: 0;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 10px;
            font-size: 20px;
            border-bottom: 1px solid rgba(23, 127, 118, 0.3);
        }
        .sidebar a:hover { background: rgba(255, 255, 255, 0.2); }
        .content {
            margin-top: 85px;
            padding: 20px;
            margin-left: 270px;
            background: black;
            color: white;
        }
        .content h2 { color: cyan; }
        .content p { font-size: 18px; }
        @media screen and (max-width: 1024px) {
            .menu-toggle { display: block; }
            .nav-links { display: none; }
            .sidebar { left: -270px; }
            .content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <button class="menu-toggle" onclick="toggleNavbar()">☰</button>
        <div class="logo"><img src="{% static 'Images/Stec.png' %}" alt="Logo"></div>
        <ul class="nav-links" id="navLinks">
            <li><a href="/home/">Home</a></li>
            <li><a href="/Service/">Services</a></li>
            <li><a href="/program/">Tutorial</a></li>
            <li><a href="/About/">About</a></li>
            <li><a href="/blog/">Blog</a></li>
            <li><a href="/contact/">Contact</a></li>
            <li><a href="/Login1/" class="login">LOGIN</a></li>
        </ul>
    </nav>
    
    <div class="sidebar" id="sidebar">
        <h2>HTML Topics</h2>
        {% for topic in topics %}
            <a href="#" onclick="loadContent('{{ topic.id }}')">{{ topic.title }}</a>
        {% endfor %}
    </div>
    
    <div class="content" id="mainContent">
        <h2>Welcome to HTML Course</h2>
        <p>Select a topic from the sidebar to begin learning.</p>
    </div>

    <script>
        function toggleNavbar() {
            document.getElementById("navLinks").classList.toggle("active");
        }

        function loadContent(topicId) {
            fetch(`/get-content/${topicId}/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("mainContent").innerHTML = `
                        <h2>${data.title}</h2>
                        ${data.Html1 ? `<p>${data.HTML1.replace(/\n/g, '<br>')}</p>` : ""}
                        ${data.Html2 ? `<p>${data.HTML2.replace(/\n/g, '<br>')}</p>` : ""}
                        ${data.Html3 ? `<p>${data.HTML3.replace(/\n/g, '<br>')}</p>` : ""}
                        ${data.Html4 ? `<p>${data.HTML4.replace(/\n/g, '<br>')}</p>` : ""}
                        ${data.html5 ? `<p>${data.HTML5.replace(/\n/g, '<br>')}</p>` : ""}
                        ${data.html6 ? `<p>${data.HTML6.replace(/\n/g, '<br>')}</p>` : ""}
                    `;
                })
                .catch(error => {
                    document.getElementById("mainContent").innerHTML = `<h2>Error</h2><p>Failed to load content.</p>`;
                    console.error("Error:", error);
                });
        }
    </script>
</body>
</html>
